services:
  fcrepo:
    image: ghcr.io/samvera/fcrepo4:4.7.5
    volumes:
      - fcrepo4:/var/lib/fedora4-home
    ports:
      - 8984:8080
    environment:
      - JAVA_OPTS=-Dfcrepo.home=/var/lib/fedora4-home
    networks:
      - curate

  fcrepo7:
    image: fcrepo/fcrepo:7.0.0-RC1-tomcat10
    environment:
      - >-
        CATALINA_OPTS=-Dfcrepo.home=/var/lib/fcrepo-home -Djava.awt.headless=true -Dfile.encoding=UTF-8
        -server -Xms1G -Xmx2G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/mem
        -Dfcrepo.jms.enabled=false -Dfcrepo.metrics.enable=true
      - ENCODED_SOLIDUS_HANDLING=passthrough
      - FEDORA_ADMIN_USERNAME=fedoraAdmin
      - FEDORA_ADMIN_PASSWORD=fedoraAdmin
    volumes:
      - fcrepo6:/var/lib/fcrepo-home
    ports:
      - 8985:8080
    networks:
      - curate

  redis:
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis:/bitnamilegacy/redis/data
    ports:
      - 6379:6379
    networks:
      - curate

  solr:
    image: solr:8.11.1
    ports:
      - 8983:8983
    command:
      - sh
      - "-c"
      - "precreate-core hydra-development /opt/solr/server/configsets/hyraxconf; solr-precreate hydra-test /opt/solr/server/configsets/hyraxconf"
    volumes:
      - solr_home:/var/solr:cached
      - ./solr/config:/opt/solr/server/configsets/hyraxconf
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    networks:
      - curate

volumes:
  fcrepo4:
  fcrepo6:
  redis:
  solr_home:

networks:
  curate:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-curate
